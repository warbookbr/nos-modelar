[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mecanifica-laboratorio"
version = "0.1.0"
description = "Laboratório computacional isolado para investigação por IA"
readme = "README.md"
requires-python = ">=3.12,<3.13"

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "hypothesis==6.167.1",
]

[tool.pytest.ini_options]
testpaths = ["testes"]
