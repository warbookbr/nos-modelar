name: Atualiza plano de autoria

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  atualizar:
    if: github.head_ref == 'agent/mcp-plano-autoria-controlada'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mcp-plano-autoria-controlada
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Atualizar índice raiz
        run: |
          python - <<'PY'
          from pathlib import Path

          caminho = Path('docs/mecanifica/INDEX.md')
          texto = caminho.read_text(encoding='utf-8')

          substituicoes = [
              (
                  '- Não há plano executivo ativo.',
                  '- O plano executivo ativo é [MCP — autoria controlada de pacotes](planos/2026-08-05-mcp-autoria-controlada.md).',
              ),
              (
                  '- Decidir explicitamente se será aberto um novo plano do MCP; autoria, materiais\n  e distribuição continuam apenas como candidatos.',
                  '- Executar e fechar o plano de autoria controlada; materiais e distribuição\n  continuam apenas como candidatos.',
              ),
              (
                  '[correção de descoberta](planos/2026-08-05-mcp-correcao-descoberta.md),\n[encerramento da Fatia 1A]',
                  '[correção de descoberta](planos/2026-08-05-mcp-correcao-descoberta.md),\n[autoria controlada](planos/2026-08-05-mcp-autoria-controlada.md),\n[encerramento da Fatia 1A]',
              ),
              (
                  'docs/mecanifica/planos/2026-08-05-mcp-correcao-descoberta.md docs/mecanifica/planos/mcp/INDEX.md',
                  'docs/mecanifica/planos/2026-08-05-mcp-correcao-descoberta.md docs/mecanifica/planos/2026-08-05-mcp-autoria-controlada.md docs/mecanifica/planos/mcp/INDEX.md',
              ),
          ]

          for antigo, novo in substituicoes:
              if antigo in texto:
                  texto = texto.replace(antigo, novo, 1)
              elif novo not in texto:
                  raise SystemExit(f'âncora não encontrada: {antigo[:80]}')

          caminho.write_text(texto, encoding='utf-8')
          PY
      - name: Regenerar mapa
        run: npm run mapa
      - name: Remover workflow temporário e publicar
        run: |
          rm .github/workflows/tmp-atualiza-plano-autoria.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/mecanifica/INDEX.md docs/uso/MAPA.md .github/workflows/tmp-atualiza-plano-autoria.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: atualiza índices do plano de autoria"
          git push origin HEAD:agent/mcp-plano-autoria-controlada
