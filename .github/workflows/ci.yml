name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # O navegador é instalado antes de qualquer gate porque a inspeção visual
      # deixou de ser exclusiva das guardas de bancada: a promoção de autoria
      # só aprova uma proposta depois de capturar duas vistas reais, e essa
      # captura acontece dentro da suíte de testes. Instalar o Chromium depois
      # de `npm run test` reprova a promoção por `inspecao-visual-falhou` e
      # transforma falta de navegador em falso defeito de autoria.
      - name: Navegador para as provas visuais
        run: npx playwright install --with-deps chromium

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test

      - name: Servidor MCP local
        run: npm run mcp:check

      - name: Build da Mecanifica
        run: npm run build

      - name: Firewall entre núcleo e catálogo
        run: npm run arquitetura:check

      - name: Bancada publicada com catálogo vazio
        run: npm run bancada:vazia:check

      - name: Harness privado prova render de fixtures
        run: npm run porteiro

      # A-60. Sem este passo o gate existiria e nunca rodaria, que é a mesma
      # armadilha que o comentário de `vitest.config.ts` já descreve: o arquivo
      # está lá, ninguém o executa, e a cobertura é impressão. Ele é o ÚNICO
      # ponto que percebe a peça ter mudado sem `pecas-resolvidas/` ser gerado
      # de novo — e o produto que consome esses arquivos vive em outro
      # repositório, então o defeito não aparece em nenhum teste daqui.
      - name: Peças publicadas em dia com a receita
        run: npm run exportar:check

      - name: MCP transporta as quatro vistas oficiais
        env:
          MCP_VISUAL_REAL: '1'
        run: npm run mcp:check

      # O painel de portas da bancada vive em `src/bancada/main.js`, que nenhum
      # arquivo de teste importa: sem esta linha, apagar o painel inteiro passa
      # verde nos outros gates.
      - name: A bancada mostra as portas que a peça publica
        run: npm run guarda:portas

      # A câmera livre é estado de autoria: o único lugar que comprova a órbita
      # e a recarga é a bancada real, não um import de helper.
      - name: A bancada restaura a câmera livre pela URL
        run: npm run guarda:camera

      # A inspeção de par mede pixels realmente visíveis com depth buffer e
      # precisa do navegador real para provar a escolha e a recarga da URL.
      - name: A bancada inspeciona duas partes com vista reproduzível
        run: npm run guarda:par

      - name: Mapa do repositório em dia
        run: npm run mapa:check

      - name: Índices documentais em dia
        run: npm run docs:toc:check

      - name: Referências a docs/*.md resolvem
        run: npm run docs:links:check

      - name: Planejamento curto e com um único plano ativo
        run: npm run planos:check
