name: CI

# A bateria lenta leva uns 31 dos 37 minutos de uma execução, e em 2026-10-21
# os minutos do mês do plano gratuito acabaram num só dia de pushes. Por isso
# push e pull request rodam tudo menos a bateria lenta, e ela roda uma vez por
# dia, só quando houve commit nas últimas 25 horas, ou à mão.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  novidade:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      houve: ${{ steps.conferir.outputs.houve }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - id: conferir
        run: |
          if [ -n "$(git log -1 --since='25 hours ago' --format=%H)" ]; then echo "houve=sim" >> "$GITHUB_OUTPUT"; else echo "houve=nao" >> "$GITHUB_OUTPUT"; fi

  build-and-test:
    needs: novidade
    if: always() && (github.event_name != 'schedule' || needs.novidade.outputs.houve == 'sim')
    runs-on: ubuntu-latest

    steps:
      # O histórico inteiro, com ramos e tags, porque o gate de vazamento
      # (`tools/arquitetura/termos-proibidos.test.mjs`) lê toda mensagem de
      # commit e todo nome de ramo e tag, e reprova num checkout raso. Medido em
      # 2026-10-21: 2.449 commits, 144 MB de pacote e 0,2 s de leitura.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # O navegador é instalado antes de qualquer gate porque a inspeção visual
      # deixou de ser exclusiva das guardas de bancada: a promoção de autoria
      # só aprova uma proposta depois de capturar duas vistas reais, e essa
      # captura acontece dentro da suíte de testes. Instalar o Chromium depois
      # de `npm run test` reprova a promoção por `inspecao-visual-falhou` e
      # transforma falta de navegador em falso defeito de autoria.
      - name: Navegador para as provas visuais
        # `chromium-headless-shell` é um DOWNLOAD SEPARADO desde o Playwright
        # 1.49, e é ele que o caminho visual do MCP lança. Instalar só
        # `chromium` fazia a prova visual morrer em "Executable doesn't exist"
        # enquanto as demais provas de bancada passavam, porque usam o chromium
        # cheio — e por isso a falta ficava invisível.
        run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: TypeScript Typecheck
        run: npm run typecheck

      # A chave da lista embaralhada de termos proibidos; sem ela o gate de
      # vazamento reprova no CI. Pull request vindo de fork não recebe segredo
      # e reprova também.
      - name: Testes rápidos
        run: npm run test:rapidos
        env:
          MECANIFICA_CHAVE_TERMOS: ${{ secrets.MECANIFICA_CHAVE_TERMOS }}

      - name: Testes lentos (todos no CI)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run test:lentos

      - name: Build da Mecanifica
        run: npm run build

      - name: Firewall entre núcleo e catálogo
        run: npm run arquitetura:check

      - name: Bancada publicada com catálogo vazio
        run: npm run bancada:vazia:check

      - name: Harness privado prova render de fixtures
        run: npm run porteiro

      # A-60. Sem este passo o gate existiria e nunca rodaria, que é a mesma
      # armadilha que o comentário de `vitest.config.ts` já descreve: o arquivo
      # está lá, ninguém o executa, e a cobertura é impressão. Ele é o ÚNICO
      # ponto que percebe a peça ter mudado sem `pecas-resolvidas/` ser gerado
      # de novo — e o produto que consome esses arquivos vive em outro
      # repositório, então o defeito não aparece em nenhum teste daqui.
      - name: Peças publicadas em dia com a receita
        run: npm run exportar:check

      # A variante visual é um SCRIPT NOMEADO, não a mesma linha com uma
      # variável de ambiente. Com `env:` no passo, o espelho local via nome de
      # comando não enxergava a diferença — `mcp:check` aparecia nos dois lados
      # e o gate passava — enquanto o CI rodava um segundo conjunto de provas
      # que ninguém rodava aqui. Foi assim que duas falhas visuais reais
      # sobreviveram.
      - name: MCP transporta as quatro vistas oficiais
        run: npm run mcp:visual:check

      # O painel de portas da bancada vive em `src/bancada/main.js`, que nenhum
      # arquivo de teste importa: sem esta linha, apagar o painel inteiro passa
      # verde nos outros gates.
      - name: A bancada mostra as portas que a peça publica
        run: npm run guarda:portas

      # A câmera livre é estado de autoria: o único lugar que comprova a órbita
      # e a recarga é a bancada real, não um import de helper.
      - name: A bancada restaura a câmera livre pela URL
        run: npm run guarda:camera

      # A inspeção de par mede pixels realmente visíveis com depth buffer e
      # precisa do navegador real para provar a escolha e a recarga da URL.
      - name: A bancada inspeciona duas partes com vista reproduzível
        run: npm run guarda:par

      # Dois artefatos gerados a partir do registro do motor. O catálogo já era
      # conferido; estes dois saíam com código de erro na divergência e ninguém
      # os rodava, então uma mudança de schema ou de mapa podia envelhecer sem
      # ninguém ver — a mesma falha que trouxe o catálogo para cá.
      - name: Mapa do motor procedural em dia
        run: npm run arquitetura:motor:check

      # A bancada e do humano e o nucleo e da IA. Sem regra, o motor procedural
      # acabaria exigindo Three.js e document para rodar, e o CLI, o MCP e os
      # testes headless parariam por causa de uma interface.
      - name: A bancada e modulo, nao dependencia de quem roda sem navegador
        run: npm run bancada:fronteira:check

      # A imagem da peça sai do pacote construído, e não de `public/`. Trocar o
      # glob que a emite deixaria a página subir, os testes verdes e a
      # referência ausente só no endereço publicado.
      - name: A bancada publicada mostra a referência da pasta da peça
        run: npm run guarda:referencia

      # A bancada relê a sessão a cada segundo e meio, e a leitura trocava a
      # peça que a pessoa tinha acabado de escolher.
      - name: A leitura periódica não desfaz a escolha da peça
        run: npm run guarda:escolha


      # Num quadro em treliça nenhum parâmetro empurra um tubo inteiro, então o
      # gesto passou a ser o canto. O que só aparece no navegador é o arrasto
      # sobreviver à reconstrução da malha que ele mesmo dispara.
      - name: Arrastar a junta deforma só quem passa por ela
        run: npm run guarda:junta

      # Teclado, seleção por raycast e escrita direta nos vértices da cena: três
      # coisas que teste de unidade não alcança. Um módulo de topologia
      # impecável convive com pontos invisíveis e movimento que não chega à
      # geometria desenhada.
      - name: O modo de edição aparece, seleciona, move e desfaz
        run: npm run guarda:edicao

      # O caminho inteiro do desenho até a leitura: editar na tela, achar o
      # botão de salvar, o arquivo sair com a descrição dentro e o comando de
      # leitura entendê-la. Cada elo já esteve quebrado — salvar exigia ter
      # puxado uma junta, e a base de comparação era a mesma malha viva.
      - name: A edição sai da bancada descrita em palavras e números
        run: npm run guarda:gesto

      # A régua de contato existia, saía com código de erro e nenhum gate a
      # chamava; foi assim que um quadro saiu em pedaços que não se tocavam.
      - name: O acervo cumpre o plano e os contatos que declara
        run: npm run guarda:acervo

      # Um braço robótico passou em tudo deitado no chão: os pontos declarados
      # ficaram a 2 mm do alvo e a peça estava virada noventa graus, porque
      # cada régua compara a peça contra a declaração dela mesma. Só a
      # comparação entre peças acusa referencial trocado.
      - name: Toda peça do acervo usa o mesmo referencial
        run: npm run guarda:referencial

      # A rodada de absorção acerta o desenho da pessoa reescrevendo a receita,
      # e acertaria mais fácil inventando termos até a conta fechar. Quem
      # declara de onde vieram os números, declara todos.
      - name: Quem declara origem de parâmetro, declara de todos
        run: npm run origens:check

      # Régua que existe e ninguém roda não protege nada, e pior, parece
      # proteger. Três casos num dia só motivaram esta guarda.
      - name: Toda régua é rodada por gate ou pelo CI
        run: npm run reguas:check

      - name: Mapa do repositório em dia
        run: npm run mapa:check

      - name: Índices documentais em dia
        run: npm run docs:toc:check

      - name: Referências a docs/*.md resolvem
        run: npm run docs:links:check

      - name: Planejamento curto e com um único plano ativo
        run: npm run planos:check

      # A separação da documentação por quem a lê não se mantém sozinha: basta
      # uma citação nova para a fronteira vazar. Este gate segura a fronteira,
      # cobra dono para cada documento de uso e impede a porta de crescer.
      - name: Documentação separada por uso
        run: npm run docs:estrutura:check

      # `docs:links:check` confere link entre documentos; ninguém conferia o que
      # a documentação cita em crase — caminho de arquivo e passo de npm. Vinte e
      # duas citações mortas viviam no caminho de leitura obrigatório, a maioria
      # apontando peças removidas do acervo em c78961f. Documento longo custa
      # contexto; documento errado custa rodada, e cobra de quem menos pode
      # conferir: a sessão nova, que obedece a citação por não conhecer a árvore.
      - name: Citações de arquivo e de comando resolvem
        run: npm run docs:citacoes:check

      # O caminho que uma sessão lê antes de escrever a primeira linha de receita
      # tinha 119,8 KB e ninguém media. Documento é barato de escrever e caro de
      # ler, e o custo não aparece: cada sessão nova paga o acervo inteiro de
      # novo, em silêncio, antes de produzir qualquer coisa. O teto força a
      # escolha entre o que se LÊ e o que se CONSULTA.
      - name: Leitura obrigatória dentro do teto
        run: npm run leitura:obrigatoria

      # O catálogo de capacidades é gerado do registro do motor e assinado por
      # hash. Ele é o que permite a skill não carregar a tabela de operações:
      # quem precisa consulta uma operação e recebe schema, exemplo e limites.
      # O `--check` já saía 1 na divergência e não era rodado em lugar nenhum,
      # então o catálogo podia descrever um motor que não existe mais sem que
      # ninguém percebesse.
      - name: Catálogo de capacidades em dia com o motor
        run: npm run catalogo:check

      # A tabela de ferramentas por objeto é gerada do JSON e cobre a lista de
      # famílias objeto por objeto; sem conferência, documento e dados divergem.
      - name: Ferramentas por objeto em dia com o JSON e a lista de famílias
        run: npm run ferramentas:check

      # O banco de provas e registro de custo mantém o documento de custo sincronizado
      # com o JSON de medições e objetos selecionados.
      - name: Banco de provas e registro de custo em dia com o JSON
        run: npm run banco-de-provas:check

      # A geometria dos três pontos de cada família registrada tem de continuar igual à da aprovação mecânica; sem
      # este passo uma família poderia mudar de forma depois de aprovada sem que ninguém reaprovasse.
      - name: Famílias registradas com a geometria igual à aprovada
        run: npm run familias:check

      # O conjunto de calibração do crítico: o desenho de cada fonte, o agente e o brief têm de ser os gravados, e a medida
      # tem de reprovar sem o crítico o que o conjunto diz ser dela. Sem este passo o crítico poderia mudar sem remedir.
      - name: Conjunto de calibração do crítico em dia com o crítico e com as fontes
        run: npm run calibracao:check
