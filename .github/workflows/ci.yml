name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test

      - name: Build da Mecanifica
        run: npm run build

      - name: Prova Zero — seleção de peças byte-idêntica ao gabarito
        run: npm run gabarito:selecao:check

      - name: Nenhum id posicional em peça nova
        run: npm run id-cru:check

      # O painel de portas da bancada vive no navegador, por isso instala o
      # Chromium antes da prova de interface.
      - name: Navegador para a prova de interface
        run: npx playwright install --with-deps chromium

      # O painel de portas da bancada vive em `src/bancada/main.js`, que nenhum
      # arquivo de teste importa: sem esta linha, apagar o painel inteiro passa
      # verde nos outros gates. Mesmo motivo e mesmo navegador da linha acima.
      - name: A bancada mostra as portas que a peça publica
        run: npm run guarda:portas

      - name: Mapa do repositório em dia
        run: npm run mapa:check

      - name: Índices documentais em dia
        run: npm run docs:toc:check

      - name: Referências a docs/*.md resolvem
        run: npm run docs:links:check
