name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test

      - name: Build da Mecanifica
        run: npm run build

      - name: Prova Zero — seleção de peças byte-idêntica ao gabarito
        run: npm run gabarito:selecao:check

      - name: Nenhum id posicional em peça nova
        run: npm run id-cru:check

      # A guarda do A-15 vive na interface, não no núcleo: nenhum dos gates
      # acima a exercita. Sem esta linha, apagar a guarda de `salvarPeca` passa
      # verde nos oito outros e a Oficina volta a gravar peça que o gate ao lado
      # reprova. Precisa de navegador, por isso instala o Chromium antes.
      - name: Navegador para a prova de interface
        run: npx playwright install --with-deps chromium

      - name: A Oficina recusa salvar peça com id posicional
        run: npm run guarda:salvar

      # O painel de portas da bancada vive em `src/bancada/main.js`, que nenhum
      # arquivo de teste importa: sem esta linha, apagar o painel inteiro passa
      # verde nos outros gates. Mesmo motivo e mesmo navegador da linha acima.
      - name: A bancada mostra as portas que a peça publica
        run: npm run guarda:portas

      - name: Mapa do repositório em dia
        run: npm run mapa:check

      - name: Índice da oficina em dia
        run: npm run docs:toc:check

      - name: Referências a docs/*.md resolvem
        run: npm run docs:links:check
