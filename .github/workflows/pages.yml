name: Deploy Mecanifica no Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "bancada.html"
      - "src/**"
      - "prototipos/fps/v3/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Construir Mecanifica
        run: npm run build

      - name: Preservar Atelier legado
        run: |
          mkdir -p dist/legado/atelier
          cp -R prototipos/fps/v3/. dist/legado/atelier/
          touch dist/.nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
