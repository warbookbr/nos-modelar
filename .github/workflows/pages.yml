name: Deploy Modelar no Pages

# A MAIN AVANÇA PELO PRÓPRIO CI. O passo `juntar` do CI move a main com a credencial do Actions, e o GitHub não dispara
# outro fluxo a partir de um envio feito com ela; com o gatilho de `push` na main esta publicação nunca rodava. Por isso ela
# roda quando o CI termina verde num envio, que é quando a main acabou de andar, e publica a main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Construir Modelar
        run: npm run build

      - name: Desativar processamento Jekyll
        run: touch dist/.nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
